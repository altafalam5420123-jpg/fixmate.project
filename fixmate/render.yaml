services:
  - type: web
    name: fixmate-server
    env: node
    plan: free
    region: singapore
    rootDir: fixmate
    buildCommand: cd server && npm install --omit=dev
    startCommand: cd server && node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_HMAC_KEY
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://localhost
      - key: TRUST_PROXY
        value: 1
      - key: DEV_SHOW_OTP
        value: 0
      - key: ALLOW_DEMO_TOPUP
        value: 0
      - key: GEMINI_API_KEY
        sync: false

